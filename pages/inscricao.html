<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Inscrição</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <div class="header-content">
            <div class="header-left">
                <div class="logo-icon">
                    <img src="../school-logo.png" alt="Logo Escola">
                </div>
            </div>
        </div>
    </header>

    <div class="container-inscricao">

        <div class="wizard-header">
            <h1>Nova Inscrição</h1>

            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

            <p>Etapa 1 de 9</p>
        </div>

        <div class="card-formulario">

            <h2>Dados do Candidato</h2>

            <div id="conteudo-etapa">

                <!-- Campos virão aqui -->

            </div>

            <div class="botoes-wizard">
                <button class="btn-secundario">Voltar</button>
                <button class="btn-principal">Próximo</button>
            </div>

        </div>

    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-text">
                © 2026 - Todos os direitos reservados.
            </div>

            <div class="footer-cebas">
                <img src="../cebas-logo.png" alt="Logo CEBAS">
                <span>CEBAS - Certificação de Entidades Beneficentes</span>
            </div>
        </div>
    </footer>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Inscrição</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <div class="header-content">
            <div class="header-left">
                <div class="logo-icon">
                    <img src="../school-logo.png" alt="Logo Escola">
                </div>
            </div>
        </div>
    </header>

    <div class="container-inscricao">

        <div class="wizard-header">
            <h1>Nova Inscrição</h1>

            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

            <p>Etapa 1 de 9</p>
        </div>

        <div class="card-formulario">

<h2>👤 Dados do Candidato</h2>

<p class="descricao-etapa">
    Informe seus dados pessoais exatamente como constam nos documentos oficiais.
</p>

<div class="form-grid">

    <div class="campo">
        <label>Nome Completo *</label>
        <input type="text">
    </div>

    <div class="campo">
        <label>Data de Nascimento *</label>
        <input type="date">
    </div>

    <div class="campo">
        <label>CPF *</label>
        <input type="text">
    </div>

    <div class="campo">
        <label>Sexo *</label>

        <select>
            <option>Selecione</option>
            <option>Feminino</option>
            <option>Masculino</option>
            <option>Prefiro não informar</option>
        </select>
    </div>

    <div class="campo largura-total">
        <label>E-mail *</label>
        <input type="email">
    </div>

    <div class="campo largura-total">
        <label>
            <input type="checkbox">
            Possui nome social?
        </label>
    </div>

</div>
           <div id="conteudo-etapa">

    <div class="secao-formulario">

        <h3>👤 Dados do Candidato</h3>

        <p class="descricao-secao">
            Informe seus dados pessoais exatamente como constam nos documentos oficiais.
        </p>

        <div class="campo">
            <label>Nome Completo *</label>
            <input type="text" id="nomeCompleto">

            <small class="feedback">
                Informe nome e sobrenome.
            </small>
        </div>

        <div class="campo-checkbox">
            <input type="checkbox" id="nomeSocial">
            <label for="nomeSocial">
                Possui nome social?
            </label>
        </div>

        <div class="campo oculto" id="campoNomeSocial">
            <label>Nome Social</label>
            <input type="text">
        </div>

        <div class="linha">

            <div class="campo">
                <label>Data de Nascimento *</label>
                <input type="date">
            </div>

            <div class="campo">
                <label>Sexo *</label>

                <select>
                    <option>Selecione</option>
                    <option>Feminino</option>
                    <option>Masculino</option>
                    <option>Não Informar</option>
                </select>
            </div>

        </div>

        <div class="campo">
            <label>CPF *</label>
            <input type="text" id="cpf">

            <small class="feedback">
                Digite um CPF válido.
            </small>
        </div>

        <div class="campo">
            <label>E-mail *</label>
            <input type="email" id="email">
        </div>

        <div class="campo">
            <label>Confirmar E-mail *</label>
            <input type="email" id="emailConfirmacao">
        </div>

    </div>

</div>
    </footer>

</body>

</html>
